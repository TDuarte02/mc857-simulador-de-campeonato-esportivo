[project]
name = "server"
version = "0.1.0"
description = "Backend do simulador de campeonato (MC857)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "copa-engine",
    "flask>=3.1.3",
    "pymongo>=4.18.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
copa-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
